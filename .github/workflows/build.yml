# Builds MSG for Windows when a version tag (v2.0.0, …) is pushed and attaches the exe to that tag's GitHub release
# (the release is created if it does not exist). Can also be run by hand (Actions → Build → Run workflow).
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the exe to (for example v2.0.0); empty builds only
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release
      # libmpv is not bundled: videos need mpv-2.dll next to the exe (see README).
      - name: Attach MSG.exe to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          cp target/release/MSG.exe MSG-windows-x64.exe
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MSG $TAG" --notes "MSG $TAG"
          gh release upload "$TAG" MSG-windows-x64.exe --clobber
