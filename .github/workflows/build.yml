# Builds MSG for Windows, Linux and macOS when a version tag (v1.0.0, …) is pushed,
# and attaches the packages to that tag's GitHub release. Can also be run by hand (Actions → Build → Run workflow).
# macOS is built here because packaging a Mac app needs symlinks, which Windows only allows as admin.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to (for example v1.0.0); empty builds only
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build
            pack: 7z a -tzip MSG-windows-x64.zip ./MSG-win32-x64/*
            file: MSG-windows-x64.zip
          - os: ubuntu-latest
            script: build:linux
            pack: tar czf MSG-linux-x64.tar.gz MSG-linux-x64
            file: MSG-linux-x64.tar.gz
          - os: macos-latest
            script: build:mac
            # ditto keeps the app bundle's symlinks and permissions.
            pack: >-
              ditto -c -k --keepParent MSG-darwin-arm64/MSG.app MSG-macos-arm64.zip &&
              ditto -c -k --keepParent MSG-darwin-x64/MSG.app MSG-macos-x64.zip
            file: MSG-macos-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - run: ${{ matrix.pack }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.file }}
      - if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.file }}
