# Builds MSG for Windows, Linux and macOS (Apple silicon and Intel) when a version tag (v1.0.0, …) is pushed,
# and attaches the packages to that tag's GitHub release. Can also be run by hand (Actions → Build → Run workflow).
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to (for example v1.0.0); empty builds only
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            native: MSG-native.exe
            native-out: MSG-native-windows-x64.exe
          - os: ubuntu-22.04
            args: ''
            native: MSG-native
            native-out: MSG-native-linux-x64
          - os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            native: MSG-native
            native-out: MSG-native-macos-arm64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            native: MSG-native
            native-out: MSG-native-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag != '' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
          releaseName: MSG ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          args: ${{ matrix.args }}
      # MSG-native (the egui window, no web view) is attached as a plain binary. libmpv is not bundled:
      # videos need mpv-2.dll / libmpv next to it (see README).
      - name: Build MSG-native
        working-directory: src-tauri
        run: cargo build --release --bin MSG-native ${{ matrix.args }}
      - name: Attach MSG-native to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          dir=src-tauri/target/${{ matrix.target }}/release
          [ -d "$dir" ] || dir=src-tauri/target/release
          cp "$dir/${{ matrix.native }}" "${{ matrix.native-out }}"
          gh release upload "$TAG" "${{ matrix.native-out }}" --clobber
