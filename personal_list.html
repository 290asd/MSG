<!doctype html>
<html>
	<head>
		<title>MSG – Favorites</title>
		<meta charset="utf-8">
		<!-- Only the app's own scripts run; images, videos and API requests may come from anywhere. -->
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob: file:; media-src * data: blob: file:; connect-src * data: blob: file:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self' file:">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="css/app.css">
		<!-- Set the theme before the first paint (app_settings.js keeps it up to date). -->
		<script src="js/chrome_api.js"></script>
		<script src="js/theme_early.js"></script>
	</head>

	<body class="favorites-page">
		<div id="ambient"></div>
		<div id="slide-wrapper">
			<img id="current-image" />
			<video id="current-video" autoplay='true' loop='true' volume='0' controls>
				<!--<source id="current-video-source-webm" type="video/webm" />-->
			</video>
			<canvas id="loading-animation" role="img" aria-label="Loading"></canvas>
		</div>

		<!-- Shown by app_settings.js: on the left over the image, or at the bottom of the page. -->
		<aside id="tag-panel" class="glass card">
			<div id="tag-list"></div>
		</aside>

		<!-- Everything below the image: only seen after scrolling down. -->
		<main id="content">
			<section id="filter" class="glass card">
				<div class="search-row">
					<a class="glass-button" href="slideshow.html" title="Back to the slideshow (Ctrl+F)">&#8592; Slideshow</a>
					<span class="toolbar-divider"></span>
					<select id="filter-site" title="Show favorites from one site"><option value="">All sites</option></select>
					<input id="filter-text" type="search" placeholder="Filter favorites…" />
					<button id="filter-button" class="primary">Filter</button>
					<button id="randomize-button" title="Show the favorites in random order. Filter with an empty box to restore the order.">&#128256; Random</button>
					<span class="toolbar-divider"></span>
					<button id="joi-button" class="glass-button" hidden title="Play the favorites shown (all, filtered or random) in joi.how">&#9829; joi</button>
					<button id="download-button" class="glass-button" title="Save the image or video on the screen to the download folder">&#128190; Download</button>
					<button id="settings-button" class="glass-button icon-button gear-button" title="Favorites settings (Ctrl+S)">&#9881;<svg class="gear-badge" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5C5 15.5 2 12 2 8.4 2 5.4 4.3 3.2 7 3.2c2 0 3.9 1.1 5 3 1.1-1.9 3-3 5-3 2.7 0 5 2.2 5 5.2 0 3.6-3 7.1-10 13.1z" /></svg></button>
				</div>
			</section>

			<div id="messages">
				<p id="warning-message"></p>
				<p id="info-message"></p>
			</div>

			<section id="player" class="glass card">
				<div id="navigation">
					<button class="nav-button" id="first-button" title="First">&#9198;</button>
					<button class="nav-button" id="previous-button" title="Previous">&#9664;</button>
					<button class="nav-button play-pause" id="play-button" title="Play slideshow">&#9654;</button>
					<button class="nav-button play-pause" id="pause-button" title="Pause slideshow">&#10074;&#10074;</button>
					<button class="nav-button" id="next-button" title="Next">&#9654;</button>
					<button class="nav-button" id="last-button" title="Last">&#9197;</button>
					<span class="nav-divider"></span>
					<span id="slide-counter">&#9829; <span id="current-slide-number"></span> / <span id="total-slide-number"></span></span>
					<span class="nav-divider"></span>
					<button class="nav-button" id="tags-toggle-button" title="Show/hide tags">#</button>
					<button class="nav-button" id="scroll-top-button" title="Back to the image">&#9652;</button>
				</div>
				<div id="thumbnail-list-wrapper">
					<div id="thumbnail-list">
					</div>
				</div>
			</section>
		</main>

		<dialog id="settings-dialog" class="glass">
			<div class="settings-shell">
				<nav class="settings-nav">
					<h2><svg class="page-badge" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5C5 15.5 2 12 2 8.4 2 5.4 4.3 3.2 7 3.2c2 0 3.9 1.1 5 3 1.1-1.9 3-3 5-3 2.7 0 5 2.2 5 5.2 0 3.6-3 7.1-10 13.1z" /></svg>Settings</h2>
					<p class="settings-page">Favorites page</p>
					<input id="settings-search" type="search" placeholder="Search settings…" autocomplete="off" />
					<p class="settings-group">Viewing</p>
					<button class="settings-tab" data-section="appearance">Appearance</button>
					<button class="settings-tab" data-section="slideshow">Slideshow</button>
					<button class="settings-tab" data-section="touch">Touch screen</button>
					<button class="settings-tab" data-section="hotkeys">Hotkeys</button>
					<p class="settings-group">Search<small>↗ leaves favorites, on the slideshow page</small></p>
					<button class="settings-tab" data-section="sites" data-page="slideshow">Sites &amp; accounts</button>
					<button class="settings-tab" data-section="filtering" data-page="slideshow">Filtering</button>
					<button class="settings-tab" data-section="quick" data-page="slideshow">Quick searches</button>
					<button class="settings-tab" data-section="history" data-page="slideshow">History</button>
					<p class="settings-group">Library</p>
					<button class="settings-tab" data-section="favorites">Favorites</button>
					<button class="settings-tab" data-section="folders">Folders</button>
					<button class="settings-tab" data-section="data">Data usage</button>
					<p class="settings-group">Help</p>
					<button class="settings-tab" data-section="about">About</button>
				</nav>
				<div class="settings-content">
					<header class="settings-header">
						<h3 id="settings-section-title"></h3>
						<button id="settings-close-button" class="icon-button" title="Close (Esc)">&times;</button>
					</header>

					<div class="settings-scroll">
						<section class="settings-section" data-section="appearance" data-title="Appearance">
							<!-- Filled in by app_settings.js -->
						</section>

						<section class="settings-section" data-section="slideshow" data-title="Slideshow">
							<ul class="settings-list">
								<li class="row">
									<span>Seconds per slide</span>
									<input id="seconds-per-slide" type="number" min="1" />
								</li>
								<li>
									<label class="row">
										<span>Play videos to the end<small>Wait for the video to finish before moving to the next slide.</small></span>
										<input id="play-videos-to-end" type="checkbox" />
									</label>
								</li>
								<li>
									<label class="row">
										<span>Auto-fit<small>Scale images and videos to fill the window.</small></span>
										<input id="auto-fit-slide" type="checkbox" />
									</label>
								</li>
								<li class="row">
									<span>Max. width<small>Used when auto-fit is off.</small></span>
									<input id="max-width" type="number" min="1" />
								</li>
								<li class="row">
									<span>Max. height<small>Used when auto-fit is off.</small></span>
									<input id="max-height" type="number" min="1" />
								</li>
							</ul>
						</section>

						<section class="settings-section" data-section="touch" data-title="Touch screen">
							<!-- Filled in by app_settings.js -->
						</section>

						<section class="settings-section" data-section="hotkeys" data-title="Hotkeys">
							<!-- Filled in by app_settings.js -->
						</section>

						<section class="settings-section" data-section="favorites" data-title="Favorites">
							<!-- Filled in by app_settings.js -->
						</section>

						<section class="settings-section" data-section="folders" data-title="Folders">
							<!-- Filled in by app_settings.js -->
						</section>

						<section class="settings-section" data-section="data" data-title="Data usage">
							<!-- Filled in by app_settings.js -->
						</section>

						<section class="settings-section" data-section="about" data-title="About">
							<!-- Filled in by app_settings.js -->
						</section>
					</div>
				</div>
			</div>
		</dialog>

		<!-- joi.how (test): its settings and game over the page, with the favorites shown as its images (app_settings.js). -->
		<div id="joi-panel" hidden>
			<iframe id="joi-frame" title="joi.how"></iframe>
			<button id="joi-close" class="glass-button icon-button" title="Close (Esc)">&times;</button>
		</div>

		<script src="js/globals.js"></script>
		<script src="js/functions.js"></script>
		<script src="js/objects/web_requester.js"></script>
		<script src="js/objects/site_manager.js"></script>
		<script src="js/objects/site_managers/site_manager_danbooru.js"></script>
		<script src="js/objects/site_managers/site_manager_derpibooru.js"></script>
		<script src="js/objects/site_managers/site_manager_e621.js"></script>
		<script src="js/objects/site_managers/site_manager_gelbooru.js"></script>
		<script src="js/objects/site_managers/site_manager_konachan.js"></script>
		<script src="js/objects/site_managers/site_manager_rule34.js"></script>
		<script src="js/objects/site_managers/site_manager_safebooru.js"></script>
		<script src="js/objects/site_managers/site_manager_xbooru.js"></script>
		<script src="js/objects/site_managers/site_manager_yandere.js"></script>
		<script src="js/objects/site_managers/site_manager_local.js"></script>
		<script src="js/objects/site_manager_factory.js"></script>
		<script src="js/objects/sites_manager.js"></script>
		<script src="js/objects/slide.js"></script>
		<script src="js/objects/personal_list.js"></script>
		<script src="js/objects/event.js"></script>
		<script src="js/objects/data_loader.js"></script>
		<script src="js/objects/remote_favorites.js"></script>
		<script src="js/objects/favorites_importer.js"></script>
		<script src="js/mvc/slideshow_model.js"></script>
		<script src="js/mvc/personal_list_model.js"></script>
		<script src="js/mvc/personal_list_view.js"></script>
		<script src="js/mvc/personal_list_controller.js"></script>
		<script src="js/personal_list_initialize.js"></script>
		<script src="js/vendor/thinking-orbs-engine.js"></script>
		<script src="js/loading_orb.js"></script>
		<script src="js/liquid_glass.js"></script>
		<script src="js/app_settings.js"></script>
	</body>
</html>
