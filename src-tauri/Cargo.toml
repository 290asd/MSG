[package]
name = "msg"
version = "1.0.1"
description = "A slideshow for booru sites, based on the BooruSlideshow extension."
edition = "2021"
default-run = "MSG"

[[bin]]
name = "MSG"
path = "src/main.rs"

# The same app with a native egui window instead of the web view (src/native/).
[[bin]]
name = "MSG-native"
path = "src/native/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
rand = "0.8"
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync", "fs"] }
base64 = "0.22"
urlencoding = "2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
image = "0.25.10"
regex = "1.13.1"
chrono = "0.4.45"
rfd = "0.17.2"
open = "5.4.4"
roxmltree = "0.21.1"
libloading = "0.9.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
