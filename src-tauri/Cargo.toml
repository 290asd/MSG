[package]
name = "msg"
version = "1.0.1"
description = "A slideshow for booru sites, based on the BooruSlideshow extension."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
rand = "0.8"
base64 = "0.22"
urlencoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
