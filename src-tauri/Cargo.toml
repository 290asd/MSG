[package]
name = "msg"
version = "1.0.1"
description = "A slideshow for booru sites, based on the BooruSlideshow extension."
edition = "2021"
default-run = "MSG"

[[bin]]
name = "MSG"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
rand = "0.8"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
urlencoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
