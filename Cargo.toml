[package]
name = "msg"
version = "2.0.2"
description = "A slideshow for booru sites, based on the BooruSlideshow extension."
edition = "2021"

[[bin]]
name = "MSG"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
rand = "0.8"
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync", "fs"] }
urlencoding = "2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
image = "0.25.10"
regex = "1.13.1"
chrono = "0.4.45"
rfd = "0.17.2"
open = "5.4.4"
roxmltree = "0.21.1"
libloading = "0.9.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
